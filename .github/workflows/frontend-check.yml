name: Frontend Check

on:
  pull_request:
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify production rule enhancement
        run: python3 scripts/test-rule-editor-core.py "$RUNNER_TEMP/rules-edited.yaml" "$RUNNER_TEMP/rules-deleted.yaml"

      - name: Verify exact proxy accounting core and real loopback traffic
        run: |
          python3 scripts/build-proxy-core.py x86_64-pc-windows-msvc --test-only
          work=$(find node_modules/.verge/proxy-core -mindepth 1 -maxdepth 1 -type d | head -1)
          (cd "$work" && go build -tags with_gvisor -o "$RUNNER_TEMP/accounting-core" .)
          python3 scripts/mihomo/live-accounting.py "$RUNNER_TEMP/accounting-core"
          python3 scripts/test-rule-editor-live.py "$RUNNER_TEMP/accounting-core" "$RUNNER_TEMP/rules-edited.yaml" "$RUNNER_TEMP/rules-deleted.yaml"

      - name: Check release compatibility and version carriers
        run: |
          node scripts/check-version-sync.mjs
          python3 scripts/test-macos-release-assets.py
          python3 scripts/test_nas_sync_release_to_dufs.py

      - name: Check frontend changes
        id: check_frontend
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/**'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.json'
              - '**/*.md'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'eslint.config.ts'
              - 'tsconfig.json'
              - 'vite.config.*'

      - name: Skip if no frontend changes
        if: steps.check_frontend.outputs.frontend != 'true'
        run: echo "No frontend changes, skipping frontend checks."

      - name: Install pnpm
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        if: steps.check_frontend.outputs.frontend == 'true'
        with:
          node-version: '24.16.0'
          cache: 'pnpm'

      - name: Restore pnpm cache
        if: steps.check_frontend.outputs.frontend == 'true'
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            pnpm-shared-stable-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        if: steps.check_frontend.outputs.frontend == 'true'

      - name: Run Prettier check
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm format:check

      - name: Run ESLint
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm lint

      - name: Run TypeScript typecheck
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm typecheck

      - name: Run managed import node health tests
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm test:import-health

      - name: Run subscription refresh policy tests
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm test:subscription-refresh

      - name: Run startup HTTP deadline and subscription content tests
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm test:startup-refresh

      - name: Code switch disconnect transaction tests
        run: pnpm test:code-switch

      - name: Rule editor persistence and failure tests
        run: node --experimental-strip-types --test scripts/test-traffic-rule-editor.mjs

      - name: Run managed subscription presentation tests
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm test:managed-subscription

      - name: Run presence throttle tests
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm test:presence-throttle

      - name: Run update button state tests
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm test:update-button-state

      - name: Run commercial isolation tests
        if: steps.check_frontend.outputs.frontend == 'true'
        run: pnpm test:commercial-isolation
